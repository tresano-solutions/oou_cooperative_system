{% extends "base.html" %}
{% block title %}Accept your affiliate appointment{% endblock %}
{% block content %}
<div class="container" style="max-width:820px">
    <h2 class="mb-1">Your affiliate appointment</h2>
    <p class="text-muted">{{ affiliate.full_name }} —
        <strong class="font-monospace">{{ affiliate.code }}</strong></p>

    <div class="card mb-3"><div class="card-body">
        <h5>Terms of reference</h5>
        {% for title, body in terms %}
        <p class="mb-2"><strong>{{ title }}</strong><br><span class="text-muted">{{ body }}</span></p>
        {% endfor %}
    </div></div>

    <div class="card"><div class="card-body">
        <form method="post">
            <input type="hidden" name="terms_version" value="{{ terms_version }}">
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="accept_terms" id="acceptTerms" value="1">
                <label class="form-check-label" for="acceptTerms">
                    I have read and accept the terms of reference above.</label>
            </div>
            <div class="mb-3" style="max-width:360px">
                <label class="form-label">Type your full name to sign *</label>
                <input class="form-control" name="signature_name" required>
            </div>
            <button class="btn btn-primary">Accept appointment</button>
        </form>
    </div></div>
</div>
{% endblock %}
