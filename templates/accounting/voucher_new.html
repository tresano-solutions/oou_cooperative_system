{% extends 'base.html' %}{% block content %}<h1 class="mb-1">New voucher</h1><p class="text-muted">Use a receipt for money in, a payment for money out, or a journal for a balanced adjustment.</p><form method="post" id="voucherForm"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="submission_token" value="{{ token }}"><input type="hidden" name="line_count" id="line_count" value="1"><div class="card mb-4"><div class="card-body row g-3"><div class="col-md-3"><label class="form-label">Voucher type</label><select class="form-select" name="kind" id="kind"><option value="receipt">Receipt</option><option value="payment">Payment</option><option value="journal">Journal</option></select></div><div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" name="date" value="{{ today }}" required></div><div class="col-md-6"><label class="form-label">Description</label><input class="form-control" name="description" required></div><div class="col-md-6 cash-only"><label class="form-label">Payer / payee</label><input class="form-control" name="party"></div><div class="col-md-3 cash-only"><label class="form-label">Bank / cash account paid from or received into</label><select class="form-select" name="bank_account">{% for a in banks %}<option value="{{ a.code }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}</select></div><div class="col-md-3 payment-only"><label class="form-label">Payment purpose</label><select class="form-select" name="purpose" id="purpose"><option value="general">General payment</option><option value="loan_disbursement">Approved loan disbursement</option></select></div><div class="col-md-6 loan-only"><label class="form-label">Pending loan to disburse</label><select class="form-select" name="disbursement_loan_id"><option value="">Choose loan</option>{% for l in loans %}<option value="{{ l.id }}">{{ l.loan_number }} — ₦{{ '%.2f'|format(l.amount) }}</option>{% endfor %}</select><small class="text-muted">Final approval and due diligence are still required.</small></div><div class="col-md-3"><label class="form-label">Reference</label><input class="form-control" name="reference"></div></div></div><div class="card"><div class="card-header d-flex justify-content-between"><span>Posting lines</span><button class="btn btn-sm btn-outline-primary" type="button" id="addLine">Add line</button></div><div class="card-body" id="lines">{% macro row(i) %}<div class="row g-2 mb-2 line"><div class="col-md-4"><select class="form-select" name="account_{{ i }}">{% for a in accounts %}<option value="{{ a.code }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}</select></div><div class="col-md-2 journal-only"><input class="form-control" name="debit_{{ i }}" placeholder="Debit"></div><div class="col-md-2 journal-only"><input class="form-control" name="credit_{{ i }}" placeholder="Credit"></div><div class="col-md-2 cash-only"><input class="form-control" name="amount_{{ i }}" placeholder="Amount"></div><div class="col-md-2"><input class="form-control" name="memo_{{ i }}" placeholder="Memo"></div></div>{% endmacro %}{{ row(0) }}</div><div class="card-footer text-end"><button class="btn btn-primary" type="submit">Post voucher</button></div></div></form><script>const lines=document.getElementById('lines'),count=document.getElementById('line_count'),kind=document.getElementById('kind'),purpose=document.getElementById('purpose');function sync(){const j=kind.value==='journal',p=kind.value==='payment';document.querySelectorAll('.cash-only').forEach(x=>x.style.display=j?'none':'');document.querySelectorAll('.journal-only').forEach(x=>x.style.display=j?'':'none');document.querySelectorAll('.payment-only').forEach(x=>x.style.display=p?'':'none');document.querySelectorAll('.loan-only').forEach(x=>x.style.display=p&&purpose.value==='loan_disbursement'?'':'none');document.querySelectorAll('.cash-only input,.cash-only select').forEach(x=>x.required=!j&&x.name!=='reference')}kind.onchange=sync;purpose.onchange=sync;document.getElementById('addLine').onclick=()=>{let i=lines.querySelectorAll('.line').length,n=lines.querySelector('.line').cloneNode(true);n.querySelectorAll('input,select').forEach(x=>{x.name=x.name.replace(/_\d+$/, '_'+i);x.value=''});lines.append(n);count.value=i+1};sync();</script>{% endblock %}
